name: CI

on:
  push:
    branches: [develop, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install ruff "mypy>=1.8,<1.15" types-requests
      - run: ruff check .
      - run: mypy flask_xxljob

  test:
    runs-on: ubuntu-latest
    name: py${{ matrix.python-version }} / Flask ${{ matrix.flask-version }}.x
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        flask-version: ["1", "2", "3"]
        exclude:
          # Flask 1.x does not support Python 3.10+.
          - python-version: "3.10"
            flask-version: "1"
          - python-version: "3.11"
            flask-version: "1"
          - python-version: "3.12"
            flask-version: "1"
          - python-version: "3.13"
            flask-version: "1"
          - python-version: "3.14"
            flask-version: "1"
          # Flask 2.x is not tested on Python 3.13+.
          - python-version: "3.13"
            flask-version: "2"
          - python-version: "3.14"
            flask-version: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - name: Install Flask ${{ matrix.flask-version }}.x
        run: |
          case "${{ matrix.flask-version }}" in
            1) pip install "Flask>=1.0,<2.0" "Werkzeug<2.0" "Jinja2<3.0" "itsdangerous<2.0" "click<8.0" "MarkupSafe<2.1" ;;
            2) pip install "Flask>=2.0,<3.0" ;;
            3) pip install "Flask>=3.0,<4.0" ;;
          esac
      - run: pip install . pytest pytest-mock
      - run: pytest -q

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install "Flask>=3.0,<4.0" . pytest pytest-cov pytest-mock
      - run: pytest -q --cov=flask_xxljob --cov-report=term-missing --cov-fail-under=90

  package:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: ${{ runner.temp }}/flask-xxljob-dist
      SMOKE_VENV: ${{ runner.temp }}/flask-xxljob-smoke-venv
      SMOKE_WORK: ${{ runner.temp }}/flask-xxljob-smoke-work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install build twine
      - run: python scripts/check_docs.py
      - name: Build fresh 0.4.0 artifacts
        run: |
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"
          python -m build --outdir "${BUILD_DIR}"
      - name: Check fresh artifacts
        run: |
          python -m twine check \
            "${BUILD_DIR}/flask_xxljob-0.4.0-py3-none-any.whl" \
            "${BUILD_DIR}/flask_xxljob-0.4.0.tar.gz"
          python scripts/check_package.py --dist-dir "${BUILD_DIR}"
      - name: Smoke-test isolated installed wheel
        run: |
          rm -rf "${SMOKE_VENV}" "${SMOKE_WORK}"
          python -m venv "${SMOKE_VENV}"
          "${SMOKE_VENV}/bin/python" -m pip install --upgrade pip
          "${SMOKE_VENV}/bin/python" -m pip install \
            "${BUILD_DIR}/flask_xxljob-0.4.0-py3-none-any.whl"
          "${SMOKE_VENV}/bin/python" -m pip check
          mkdir -p "${SMOKE_WORK}"
          cp scripts/smoke_installed_wheel.py "${SMOKE_WORK}/smoke_installed_wheel.py"
          cd "${SMOKE_WORK}"
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          "${SMOKE_VENV}/bin/python" smoke_installed_wheel.py \
            --source-root "${GITHUB_WORKSPACE}"

  required-ci:
    name: Required CI
    if: always()
    needs:
      - lint
      - test
      - coverage
      - package
    runs-on: ubuntu-latest
    steps:
      - name: Require every CI job to pass
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        shell: bash
        run: |
          set -euo pipefail

          results=(
            "lint=${LINT_RESULT}"
            "test=${TEST_RESULT}"
            "coverage=${COVERAGE_RESULT}"
            "package=${PACKAGE_RESULT}"
          )

          for entry in "${results[@]}"; do
            job="${entry%%=*}"
            result="${entry#*=}"
            if [[ "${result}" != "success" ]]; then
              echo "::error title=Required CI failed::${job} finished with result '${result}'."
              exit 1
            fi
          done
