name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.4.0"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release version and source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import runpy; print(runpy.run_path("flask_xxljob/_version.py")["__version__"])')"
          grep -Fqx "## [${version}] - 2026-08-16" CHANGELOG.md
          grep -Fqx "## [${version}] - 2026-08-16" CHANGELOG.zh-CN.md
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
              exit 1
            fi
            git fetch origin master:refs/remotes/origin/master
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
              echo "Release tag commit is not contained in origin/master." >&2
              exit 1
            fi
          fi
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check dist/*
      - name: Check distribution contents
        run: python scripts/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flask-xxljob
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flask-xxljob
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
