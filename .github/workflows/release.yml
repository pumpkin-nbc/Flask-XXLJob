name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v0.4.0"

permissions:
  contents: read

jobs:
  build:
    name: Build and validate distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release version and source
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import runpy; print(runpy.run_path("flask_xxljob/_version.py")["__version__"])')"
          grep -Fqx "## [${version}] - 2026-08-16" CHANGELOG.md
          grep -Fqx "## [${version}] - 2026-08-16" CHANGELOG.zh-CN.md
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
              echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
              exit 1
            fi
            git fetch origin master:refs/remotes/origin/master
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
              echo "Release tag commit is not contained in origin/master." >&2
              exit 1
            fi
          fi
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Check documentation
        run: python scripts/check_docs.py
      - name: Build wheel and source distribution
        env:
          BUILD_DIR: ${{ runner.temp }}/flask-xxljob-release-dist
        run: |
          rm -rf "${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}"
          python -m build --outdir "${BUILD_DIR}"
      - name: Check distribution metadata
        env:
          BUILD_DIR: ${{ runner.temp }}/flask-xxljob-release-dist
        run: |
          python -m twine check \
            "${BUILD_DIR}/flask_xxljob-0.4.0-py3-none-any.whl" \
            "${BUILD_DIR}/flask_xxljob-0.4.0.tar.gz"
      - name: Check distribution contents
        env:
          BUILD_DIR: ${{ runner.temp }}/flask-xxljob-release-dist
        run: python scripts/check_package.py --dist-dir "${BUILD_DIR}"
      - name: Smoke-test isolated installed wheel
        env:
          BUILD_DIR: ${{ runner.temp }}/flask-xxljob-release-dist
          SMOKE_VENV: ${{ runner.temp }}/flask-xxljob-release-smoke-venv
          SMOKE_WORK: ${{ runner.temp }}/flask-xxljob-release-smoke-work
        run: |
          rm -rf "${SMOKE_VENV}" "${SMOKE_WORK}"
          python -m venv "${SMOKE_VENV}"
          "${SMOKE_VENV}/bin/python" -m pip install --upgrade pip
          "${SMOKE_VENV}/bin/python" -m pip install \
            "${BUILD_DIR}/flask_xxljob-0.4.0-py3-none-any.whl"
          "${SMOKE_VENV}/bin/python" -m pip check
          mkdir -p "${SMOKE_WORK}"
          cp scripts/smoke_installed_wheel.py "${SMOKE_WORK}/smoke_installed_wheel.py"
          cd "${SMOKE_WORK}"
          unset PYTHONPATH
          export PYTHONNOUSERSITE=1
          "${SMOKE_VENV}/bin/python" smoke_installed_wheel.py \
            --source-root "${GITHUB_WORKSPACE}"
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: ${{ runner.temp }}/flask-xxljob-release-dist/
          if-no-files-found: error
          retention-days: 7

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/flask-xxljob
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    name: Publish to PyPI
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/flask-xxljob
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
