[tox]
# Python x Flask 兼容性矩阵；缺失的解释器会被跳过。
# Python x Flask compatibility matrix; unavailable interpreters are skipped.
envlist =
    py38-flask{1,2,3}
    py39-flask{1,2,3}
    py310-flask{2,3}
    py311-flask{2,3}
    py312-flask{2,3}
    py313-flask3
    py314-flask3
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-mock
    flask1: Flask>=1.0,<2.0
    flask1: Werkzeug<2.0
    flask1: Jinja2<3.0
    flask1: itsdangerous<2.0
    flask1: click<8.0
    flask1: MarkupSafe<2.1
    flask2: Flask>=2.0,<3.0
    flask3: Flask>=3.0,<4.0
commands =
    pytest -q

[testenv:lint]
deps =
    ruff
    mypy>=1.8,<1.15
    types-requests
commands =
    ruff check .
    mypy flask_xxljob
